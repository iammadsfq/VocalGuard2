[package]
name = "audioprocessor"
version = "0.1.0"
edition = "2024"

[lib]
name = "audioprocessor"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "audioprocessor"
path = "src/main.rs"

[features]
python = ["pyo3"]
native = []

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }
num-complex = "0.4.6"
realfft = "3.5.0"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
clap = { version = "4.5.39", features = ["derive"] }
csv = "1.3.1"
rand = "0.9.2"
symphonia = { version = "0.5.5", features = ["flac"] }
parquet = "54"
# ndarray-linalg = { version = "0.18.1", features = ["openblas-static"] }
